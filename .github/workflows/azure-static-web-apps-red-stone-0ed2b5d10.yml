name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
  schedule:
    - cron: '0 5 * * *'  # Daily at 5 AM UTC — publishes future-dated articles

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.153.2'
          extended: true
      - name: Build Hugo
        run: hugo --minify
        env:
          HUGO_ENVIRONMENT: production
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_STONE_0ED2B5D10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "public"
          api_location: ""
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_STONE_0ED2B5D10 }}
          action: "close"

  lighthouse:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Lighthouse Audit
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://red-stone-0ed2b5d10.7.azurestaticapps.net/
            https://red-stone-0ed2b5d10.7.azurestaticapps.net/articles/
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true

  accessibility:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Accessibility Audit
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.153.2'
          extended: true
      - name: Build Hugo
        run: hugo --minify
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start server and run pa11y-ci
        continue-on-error: true
        run: |
          npx -y http-server ./public -p 1313 -s &
          sleep 3
          npx -y pa11y-ci --config .github/pa11y/.pa11yci.json

  notify_on_failure:
    needs: [build_and_deploy_job]
    if: failure()
    runs-on: ubuntu-latest
    name: Notify on Failure
    steps:
      - name: Create GitHub Issue on Build Failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build/Deploy failure — ${context.sha.substring(0, 7)}`,
              body: `Build or deploy failed for commit ${context.sha}.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'deploy-failure']
            });
