<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="{{ if .Params.headline }}{{ .Params.headline }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ with .Params.image }}<meta property="og:image" content="{{ . }}">{{ end }}
  <meta property="og:site_name" content="History News">
  {{ if .IsPage }}<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
  {{ with .Params.era }}<meta property="article:section" content="{{ . }}">{{ end }}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .Params.headline }}{{ .Params.headline }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ with .Params.image }}<meta name="twitter:image" content="{{ . }}">{{ end }}

  <!-- Additional SEO -->
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="robots" content="index, follow">
  {{ with .Params.era }}<meta name="keywords" content="{{ . }}, history, {{ $.Site.Title }}">{{ end }}

  {{ if .IsPage }}
  <!-- Structured Data: Article -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": {{ with .Params.headline }}{{ . | jsonify }}{{ else }}{{ .Title | jsonify }}{{ end }},
    "description": {{ with .Params.summary }}{{ . | jsonify }}{{ else }}{{ .Site.Params.description | jsonify }}{{ end }},
    {{ with .Params.image }}"image": {{ . | jsonify }},{{ end }}
    "datePublished": "{{ .Date.Format "2006-01-02" }}",
    "author": {
      "@type": "Organization",
      "name": "History News"
    },
    "publisher": {
      "@type": "Organization",
      "name": "History News",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ .Site.BaseURL }}images/logo.svg"
      }
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": {{ .Permalink | jsonify }}
    }
  }
  </script>
  {{ else if .IsHome }}
  <!-- Structured Data: WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": {{ .Site.Title | jsonify }},
    "url": {{ .Site.BaseURL | jsonify }},
    "description": {{ .Site.Params.description | jsonify }},
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ .Site.BaseURL }}?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  {{ end }}

  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0" defer></script>
  <script src="/js/search.js" defer></script>
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
